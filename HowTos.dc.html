<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#1c1420} a{color:#e29bcb} a:hover{color:#f0b8dc}
    /* mobile viewport guards */
    html,body{max-width:100%;overflow-x:hidden}
    *{min-width:0}
    img,video,image-slot{max-width:100%}

    /* mobile */
    @media (max-width:820px){
      nav{padding:16px clamp(16px,4vw,24px) !important;gap:12px !important}
      nav>div{flex-wrap:wrap !important;gap:14px 18px !important}
      nav>a:first-child{width:100%;display:block}
      nav span{font-size:7.1vw !important;letter-spacing:0 !important;white-space:nowrap;display:block;text-align:left}
      nav>div{width:100%;display:grid !important;grid-template-columns:1fr auto;column-gap:16px;row-gap:10px !important;align-items:start}
      nav>div>a{grid-column:1}
      nav>div>a[href="Contact.dc.html"]{grid-column:2;grid-row:1 / span 5;align-self:center;justify-self:end}
      /* two-column text/image layouts -> stack */
      [style*="minmax(200px"],[style*="minmax(280px"],[style*="minmax(300px"],[style*="minmax(260px, 1fr)"]{grid-template-columns:minmax(0,1fr) !important;gap:28px !important}
      /* fixed 5/6-track mosaics -> single column, drop pinning */
      [style*="repeat(6"],[style*="repeat(5"],.more-cats{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:none !important;grid-auto-rows:auto !important}
      [style*="repeat(6"]>*,[style*="repeat(5"]>*,.more-cats>a{grid-column:auto !important;grid-row:auto !important;aspect-ratio:auto !important}
      /* masonry + text columns */
      [style*="column-count: 4"]{column-count:2 !important}
      [style*="column-count: 3"],[style*="column-count: 2"]{column-count:1 !important}
      /* fixed-height photo rows -> full width */
      section img[style*="height: 385px"],section img[style*="height: 380px"],section img[style*="height: 300px"],section img[style*="height: 510px"]{height:auto !important;width:100% !important;max-width:100% !important}
      /* fixed-width cards */
      a[style*="calc("]{width:100% !important}
      h1{font-size:clamp(24px,7vw,34px) !important}
      section{padding-top:28px !important}
    }
    @media (max-width:520px){
      [style*="auto-fill"]{grid-template-columns:minmax(0,1fr) !important}
      [style*="column-count: 4"]{column-count:1 !important}
    }
    .pf-menu{position:relative}
    .pf-menu .pf-drop{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:14px;z-index:40}
    .pf-menu:hover .pf-drop,.pf-menu:focus-within .pf-drop{display:block}
    .pf-drop-inner{background:#241b2b;border:1px solid rgba(246,238,248,0.12);border-radius:14px;padding:8px;min-width:230px;box-shadow:0 14px 40px rgba(0,0,0,0.45);display:flex;flex-direction:column}
    .pf-drop-inner a{display:block;padding:9px 14px;border-radius:9px;text-decoration:none;color:#f6eef8;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap}
    .pf-drop-inner a:hover{background:rgba(226,155,203,0.16);color:#f0b8dc}
  </style>
</helmet>
<div style="background:#1c1420;color:#f6eef8;min-height:100vh;font-family:'Work Sans',sans-serif">

  <nav style="background:linear-gradient(135deg,#e6b8d8,#b9a8d6);padding:22px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <a href="Portfolio-Overview.dc.html" style="text-decoration:none"><span style="font-family:'Poppins',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.01em;font-size:35px;color:#fdf8f5">Haskins Design &amp; Build</span></a>
    <div style="display:flex;align-items:center;gap:24px">
      <a href="About.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">About</a>
      <a href="Portfolio-Overview.dc.html#work" style="text-decoration:none;color:#3b2540;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Portfolio</a>
      <a href="Pricing.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">Pricing</a>
      <a href="Resources.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">Resources</a>
      <a href="Contact.dc.html" style="display:inline-flex;align-items:center;padding:11px 22px;border-radius:999px;background:#1c1420;color:#e29bcb;text-decoration:none;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.03em">Contact</a>
    </div>
  </nav>

  <section style="position:relative;overflow:hidden;padding:88px clamp(20px,5vw,72px) 56px">
    <div style="position:absolute;top:-120px;right:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(167,154,209,0.3),transparent 70%);filter:blur(8px);pointer-events:none"></div>
    <div style="max-width:1200px;margin:0 auto;position:relative">
      <h1 style="font-family:'Poppins',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.01em;font-size:clamp(32px,4.6vw,52px);line-height:1.1;margin:0 0 20px">How To's</h1>
      <p style="font-size:17px;line-height:1.65;max-width:58ch;margin:0;color:rgba(246,238,248,0.72)">Coming soon.</p>
    </div>
  </section>

  <section style="max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px) 96px">
  </section>

  <nav style="background:linear-gradient(135deg,#e6b8d8,#b9a8d6);padding:22px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <a href="Portfolio-Overview.dc.html" style="text-decoration:none"><span style="font-family:'Poppins',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:0.01em;font-size:35px;color:#fdf8f5">Haskins Design &amp; Build</span></a>
    <div style="display:flex;align-items:center;gap:24px">
      <a href="About.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">About</a>
      <a href="Portfolio-Overview.dc.html#work" style="text-decoration:none;color:#3b2540;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Portfolio</a>
      <a href="Pricing.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">Pricing</a>
      <a href="Resources.dc.html" style="text-decoration:none;color:#3b2540;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.04em">Resources</a>
      <a href="Contact.dc.html" style="display:inline-flex;align-items:center;padding:11px 22px;border-radius:999px;background:#1c1420;color:#e29bcb;text-decoration:none;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.03em">Contact</a>
    </div>
  </nav>

  <div style="max-width:1200px;margin:0 auto;padding:24px clamp(20px,5vw,72px);font-size:13px;color:rgba(246,238,248,0.45)">Haskins Design &amp; Build</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const howtos = [
