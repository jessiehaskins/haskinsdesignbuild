<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    // Assembled at runtime so the address never appears as plain text in the HTML source.
    const u = ['jessie', 'haskinsdesignbuild', 'com'];
    const addr = u[0] + String.fromCharCode(64) + u[1] + '.' + u[2];
    return { mailHref: 'mai' + 'lto:' + addr, mailLabel: addr };
  }
}
